<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <title>Document</title>
</head>
<body>
<main id="main">

    <section id="ejercicio2">
        <label for="">Ejercicio 2</label>
        <input type="number" name="" id="number">
        <button onclick="addNumber()">Send</button>
        <p></p>
    </section>

    <script>

       function addNumber(){
            fetch('http://localhost:8000/minmax',{
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify( { "number": `${document.querySelector('#number').value}`  })
            })
            .then( (res)=>{ return res.json() })
            .then( (data) => {
                document.querySelector('#ejercicio2 p').innerHTML = `Min: ${data.min}  | Max: ${data.max}`
            })
        }


    </script>


</main>
</body>
</html>
